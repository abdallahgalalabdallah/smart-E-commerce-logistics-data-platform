networks:
  logistics_network:
    name: logistics_network
    driver: bridge

volumes:
  mssql_data:
  localstack_data:
  kafka_data:
  grafana_data:
  airflow_sources:

services:
  # -------------------------------------------------------
  # 1. Data Warehouse & Staging: SQL Server 2022
  # -------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: de_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - logistics_network

  # -------------------------------------------------------
  # 2. Data Lake: LocalStack (AWS S3 Mock)
  # -------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: de_datalake_s3
    restart: always
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - logistics_network

  # -------------------------------------------------------
  # 3. Real-Time Streaming: Apache Kafka (KRaft Mode - No ZooKeeper)
  # -------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: de_kafka
    restart: always
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - logistics_network

  # -------------------------------------------------------
  # 4. Real-Time Dashboard: Grafana
  # -------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: de_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - sqlserver
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - logistics_network

  # -------------------------------------------------------
  # 5. Orchestration: Apache Airflow
  # -------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.10
    container_name: de_airflow_init
    entrypoint: [/bin/bash, -c]
    command:
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R 50000:0 /sources
        airflow db init
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow:/sources
    networks:
      - logistics_network

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: de_airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8088:8080"

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    container_name: de_airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - logistics_network