version: 2

models:
  - name: dim_customer
    description: "Deduplicated customer dimension at the customer_unique_id grain."
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - unique
          - not_null

  - name: dim_seller
    description: "Seller dimension."
    columns:
      - name: seller_key
        tests:
          - unique
          - not_null
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension enriched with English category names."
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_geography
    description: "Brazilian ZIP code prefix geography dimension."
    columns:
      - name: geography_key
        tests:
          - unique
          - not_null
      - name: zip_code_prefix
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Date dimension generated from order purchase and delivery timestamps."
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null

  - name: fact_orders
    description: "Order-level fact table (one row per order_id)."
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: geography_key
        tests:
          - relationships:
              to: ref('dim_geography')
              field: geography_key
      - name: purchase_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: delivered_date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: main_payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: fact_order_items
    description: "Order line-item fact table (one row per order_id + order_item_id)."
    columns:
      - name: order_item_key
        tests:
          - unique
          - not_null
      - name: order_key
        tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: seller_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_seller')
              field: seller_key